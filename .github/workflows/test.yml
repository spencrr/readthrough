# The gate, as both CI and the release pipeline run it: lint, format, and types; the tests on every supported
# platform and Python; then a build whose wheel is installed into a clean environment and run. Only ever called
# (by ci.yml on every push and PR, and by release.yml on a tag), never triggered on its own.
name: Checks

on:
  workflow_call:

permissions: {}

env:
  PYTHONUTF8: "1"
  UV_LOCKED: "1" # fail if uv.lock is out of date rather than silently resolving anew

jobs:
  lint:
    name: lint, format, types
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # latest-known is the newest uv whose checksum this pinned setup-uv ships, so bumping the pin is what moves uv
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check . --output-format github
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      # The browser tests drive the runner's Edge or Chrome. On CI they fail, rather than skip, without one.
      - run: uv run pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          overwrite: true # a re-run of this job uploads the same name again
          retention-days: 7

  build:
    name: build artifacts
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache here: the artifact is what gets published, and a poisoned cache entry would end up inside it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          enable-cache: false
      - run: uv build
      # Install the wheel into a clean environment without the extra, and prove the CLI runs on the stdlib alone.
      - run: |
          uv venv --python 3.11 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/readthrough --version
          /tmp/clean/bin/python -c "from readthrough import assistants; print(assistants.resolve())"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          overwrite: true # a re-run of this job uploads the same name again
          if-no-files-found: error
