# Lints the workflows themselves (pins, credentials left in checkouts, caches in publishing jobs, injection) on
# every push and PR. The job fails on a finding, which is what makes it a required check worth having: in the
# action's SARIF mode the job passes with findings and only the Security tab knows.
name: Workflow lint

on:
  push:
    branches: [main, "release/*"]
  pull_request:

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false # fail the job on findings instead of uploading SARIF
