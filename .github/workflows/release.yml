# A v* tag becomes a PyPI release and a GitHub release, through the same checks CI runs, once the maintainer has
# approved the pypi environment. The tag is the only trigger: there is no manual dispatch, so the only way to
# publish is to put a tag on a commit that is on main or a release branch, and then to click Approve.
name: Release

on:
  push:
    tags: ["v*"]

# Never cancel a release in flight: a half-published release is worse than a late one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: tag on a release branch, matching the version and the changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, and fetching main and release/* to check the tag's ancestry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the ancestry check needs the branches' history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Only an admin can create a v* tag or a release/* branch, and nobody else lands a commit on main without a
      # reviewed pull request, so a commit here was put on a release branch by the maintainer.
      - name: the tagged commit is on main or a release branch
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
          if ! git for-each-ref --contains "$SHA" refs/remotes/origin/main refs/remotes/origin/release/ | grep -q .; then
            echo "::error::$SHA is not on main or a release/* branch"
            exit 1
          fi
      - name: the tag is the package's version, and the changelog has its section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG, but pyproject.toml says $version"
            exit 1
          fi
          # The section runs to the next heading, or to the link definitions a changelog may end with.
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && (/^## / || /^\[[^]]+\]: /) { exit }
            on { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          overwrite: true

  checks:
    needs: [check]
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read # the checks check out the repo

  # Runs no build tooling: it takes the dist artifact the checks built, attests it, and hands it to PyPI and to
  # the release. It waits for the maintainer's approval of the pypi environment before it starts.
  publish:
    name: publish to PyPI and GitHub
    needs: [check, checks]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/readthrough/
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # trusted publishing to PyPI, and signing the provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # a re-run after a failure later in this job must not fail here
      # The publisher leaves its PEP 740 attestation files in dist/; the release carries only the distributions.
      # A release that already exists is accepted only if it carries exactly the files this run built: anyone with
      # write access can create a release for a tag, and the approval here must not turn theirs into ours.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[] | "\(.digest) \(.name)"' > existing.txt 2>/dev/null; then
            for file in dist/*.whl dist/*.tar.gz; do
              line="sha256:$(sha256sum "$file" | cut -d' ' -f1) $(basename "$file")"
              if ! grep -qxF "$line" existing.txt; then
                echo "::error::release $TAG already exists and its $(basename "$file") is not the one this run built"
                exit 1
              fi
            done
            if [ "$(wc -l < existing.txt)" -ne 2 ]; then
              echo "::error::release $TAG already exists with assets this run didn't build"
              exit 1
            fi
            echo "release $TAG already exists with exactly this run's files; leaving it as it is"
            exit 0
          fi
          # A patch for an older line, released from its release/* branch, must not become the latest release.
          newest=$({ echo "$TAG"; gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'; } | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
          gh release create "$TAG" --verify-tag --latest="$latest" --title "$TAG" --notes-file notes.md dist/*.whl dist/*.tar.gz
