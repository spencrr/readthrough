name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the runs it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read # the checks check out the repo

  # The one status check the branch ruleset requires. Green only when every job in the checks was, so adding a
  # platform or a Python version never means editing the ruleset.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [checks]
    if: ${{ !cancelled() }}
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success