version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a release has to be a week old before it is proposed
    commit-message:
      prefix: build(deps) # Conventional Commits, as the pull request check requires
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Pinned exactly and bumped by hand: its diagnostics change between releases (see AGENTS.md).
      - dependency-name: ty
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
